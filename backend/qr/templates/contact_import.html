<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import Contacts — Moments & Memories</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, 'Helvetica Neue', sans-serif;
            background: #0d1a10;
            color: #e4eee1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(156,176,146,0.2);
            border-radius: 4px;
            padding: 40px 28px;
            max-width: 380px;
            width: 100%;
            text-align: center;
        }
        .logo {
            font-size: 11px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #9cb092;
            margin-bottom: 32px;
            opacity: 0.7;
        }
        h1 {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
            color: #e4eee1;
        }
        h1 em {
            font-style: italic;
            color: #9cb092;
        }
        p {
            font-size: 13px;
            color: rgba(178,195,177,0.6);
            margin-bottom: 32px;
            line-height: 1.7;
            letter-spacing: 0.02em;
        }
        button {
            width: 100%;
            padding: 15px;
            border-radius: 2px;
            border: none;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }
        #selectBtn {
            background: #9cb092;
            color: #0d1a10;
        }
        #selectBtn:hover { background: #b2c3b1; }
        #selectBtn:disabled { opacity: 0.4; cursor: not-allowed; }
        #fallbackBtn {
            background: transparent;
            border: 1px solid rgba(156,176,146,0.3);
            color: #9cb092;
            margin-top: 10px;
            display: none;
        }
        #fallbackBtn:hover { border-color: #9cb092; }
        #status {
            margin-top: 20px;
            font-size: 12px;
            padding: 12px 16px;
            border-radius: 2px;
            display: none;
            letter-spacing: 0.05em;
            text-align: left;
        }
        .status-success {
            background: rgba(156,176,146,0.15);
            border: 1px solid rgba(156,176,146,0.3);
            color: #9cb092;
            display: block !important;
        }
        .status-error {
            background: rgba(239,100,100,0.1);
            border: 1px solid rgba(239,100,100,0.2);
            color: #fca5a5;
            display: block !important;
        }
        #manualForm { margin-top: 24px; text-align: left; display: none; }
        #manualForm label {
            display: block;
            font-size: 9px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(178,195,177,0.5);
            margin-bottom: 6px;
        }
        #manualForm input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 2px;
            border: 1px solid rgba(156,176,146,0.2);
            background: rgba(255,255,255,0.03);
            color: #e4eee1;
            margin-bottom: 16px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        #manualForm input:focus { border-color: rgba(156,176,146,0.5); }
        #manualForm input::placeholder { color: rgba(178,195,177,0.25); }
        #submitManual {
            background: #9cb092;
            color: #0d1a10;
            width: 100%;
            padding: 14px;
            border-radius: 2px;
            border: none;
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 4px;
        }
        #submitManual:hover { background: #b2c3b1; }
        .divider {
            border: none;
            border-top: 1px solid rgba(156,176,146,0.1);
            margin: 28px 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <p class="logo">Moments &amp; Memories</p>
        <h1>Share your <em>contacts</em></h1>
        <p>Select the people you'd like to invite. They'll appear instantly on the host's screen.</p>
        <button id="selectBtn">Choose Contacts</button>
        <button id="fallbackBtn">Enter Manually Instead</button>
        <div id="manualForm">
            <hr class="divider">
            <label>Name</label>
            <input type="text" id="manualName" placeholder="Full name">
            <label>Email</label>
            <input type="email" id="manualEmail" placeholder="email@example.com">
            <label>Phone (optional)</label>
            <input type="tel" id="manualPhone" placeholder="+1 555 000 0000">
            <button id="submitManual">Add Contact</button>
        </div>
        <div id="status"></div>
    </div>
    <script>
        const token = '{{ token }}';
        const apiBase = '{{ api_base }}';

        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = type === 'success' ? 'status-success' : 'status-error';
        }

        async function sendContacts(contacts) {
            return fetch(`${apiBase}/qr/contacts/${token}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contacts }),
            });
        }

        document.getElementById('selectBtn').addEventListener('click', async () => {
            if ('contacts' in navigator && 'ContactsManager' in window) {
                try {
                    const selected = await navigator.contacts.select(['name', 'email', 'tel'], { multiple: true });
                    const contacts = selected.map(c => ({
                        name: c.name?.[0] || '',
                        email: c.email?.[0] || '',
                        phone: c.tel?.[0] || '',
                    }));
                    const resp = await sendContacts(contacts);
                    if (resp.ok) {
                        showStatus('Contacts sent — check the host\'s screen.', 'success');
                        document.getElementById('selectBtn').disabled = true;
                    } else {
                        showStatus('Something went wrong. Please try again.', 'error');
                    }
                } catch {
                    showStatus('Could not access contacts. Use manual entry below.', 'error');
                    document.getElementById('fallbackBtn').style.display = 'block';
                }
            } else {
                document.getElementById('selectBtn').style.display = 'none';
                document.getElementById('fallbackBtn').style.display = 'none';
                document.getElementById('manualForm').style.display = 'block';
                showStatus('Contact picker not supported on this browser. Use manual entry below.', 'error');
            }
        });

        document.getElementById('fallbackBtn').addEventListener('click', () => {
            document.getElementById('manualForm').style.display = 'block';
        });

        document.getElementById('submitManual').addEventListener('click', async () => {
            const name = document.getElementById('manualName').value.trim();
            const email = document.getElementById('manualEmail').value.trim();
            const phone = document.getElementById('manualPhone').value.trim();
            if (!name && !email) {
                showStatus('Enter at least a name or email.', 'error');
                return;
            }
            const resp = await sendContacts([{ name, email, phone }]);
            if (resp.ok) {
                showStatus('Contact sent — check the host\'s screen.', 'success');
                document.getElementById('submitManual').disabled = true;
            } else {
                showStatus('Something went wrong. Please try again.', 'error');
            }
        });
    </script>
</body>
</html>
