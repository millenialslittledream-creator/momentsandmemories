<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import Contacts — Moments & Memories</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #0f050a; color: #f8f6f7; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 32px 24px; max-width: 380px; width: 100%; text-align: center; }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #e61980; }
        p { font-size: 14px; color: rgba(255,255,255,0.6); margin-bottom: 28px; line-height: 1.6; }
        button { width: 100%; padding: 16px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        #selectBtn { background: #e61980; color: white; }
        #selectBtn:disabled { opacity: 0.5; cursor: not-allowed; }
        #fallbackBtn { background: rgba(255,255,255,0.1); color: white; margin-top: 12px; display: none; }
        #status { margin-top: 20px; font-size: 14px; padding: 12px; border-radius: 10px; display: none; }
        .status-success { background: rgba(34,197,94,0.2); color: #86efac; display: block !important; }
        .status-error { background: rgba(239,68,68,0.2); color: #fca5a5; display: block !important; }
        #manualForm { margin-top: 20px; text-align: left; display: none; }
        #manualForm input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: white; margin-bottom: 10px; font-size: 14px; }
        #manualForm input::placeholder { color: rgba(255,255,255,0.4); }
        #submitManual { background: #e61980; color: white; width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 15px; cursor: pointer; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Import Contacts</h1>
        <p>Select contacts from your phone to add as invitees to your event.</p>
        <button id="selectBtn">Choose Contacts</button>
        <button id="fallbackBtn">Enter Manually Instead</button>
        <div id="manualForm">
            <input type="text" id="manualName" placeholder="Name">
            <input type="email" id="manualEmail" placeholder="Email">
            <input type="tel" id="manualPhone" placeholder="Phone (optional)">
            <button id="submitManual">Add Contact</button>
        </div>
        <div id="status"></div>
    </div>
    <script>
        const token = '{{ token }}';
        const apiBase = '{{ api_base }}';

        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = type === 'success' ? 'status-success' : 'status-error';
        }

        async function sendContacts(contacts) {
            return fetch(`${apiBase}/qr/contacts/${token}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contacts }),
            });
        }

        document.getElementById('selectBtn').addEventListener('click', async () => {
            if ('contacts' in navigator && 'ContactsManager' in window) {
                try {
                    const selected = await navigator.contacts.select(['name', 'email', 'tel'], { multiple: true });
                    const contacts = selected.map(c => ({
                        name: c.name?.[0] || '',
                        email: c.email?.[0] || '',
                        phone: c.tel?.[0] || '',
                    }));
                    const resp = await sendContacts(contacts);
                    if (resp.ok) {
                        showStatus('Contacts sent! Check your laptop.', 'success');
                        document.getElementById('selectBtn').disabled = true;
                    } else {
                        showStatus('Something went wrong. Try again.', 'error');
                    }
                } catch (err) {
                    showStatus('Could not access contacts. Use manual entry.', 'error');
                    document.getElementById('fallbackBtn').style.display = 'block';
                }
            } else {
                document.getElementById('selectBtn').style.display = 'none';
                document.getElementById('fallbackBtn').style.display = 'none';
                document.getElementById('manualForm').style.display = 'block';
                showStatus('Contact picker not supported on this browser. Use manual entry below.', 'error');
            }
        });

        document.getElementById('fallbackBtn').addEventListener('click', () => {
            document.getElementById('manualForm').style.display = 'block';
        });

        document.getElementById('submitManual').addEventListener('click', async () => {
            const name = document.getElementById('manualName').value.trim();
            const email = document.getElementById('manualEmail').value.trim();
            const phone = document.getElementById('manualPhone').value.trim();
            if (!name && !email) {
                showStatus('Enter at least a name or email.', 'error');
                return;
            }
            const resp = await sendContacts([{ name, email, phone }]);
            if (resp.ok) {
                showStatus('Contact sent! Check your laptop.', 'success');
                document.getElementById('submitManual').disabled = true;
            } else {
                showStatus('Something went wrong. Try again.', 'error');
            }
        });
    </script>
</body>
</html>
