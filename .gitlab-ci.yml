stages:
  - test
  - build
  - deploy

# Frontend Tests
frontend-test:
  stage: test
  image: node:20
  cache:
    key: "$CI_COMMIT_REF_SLUG-node"
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run lint
    - npm run test
  only:
    - main
    - merge_requests

# Backend Tests
backend-test:
  stage: test
  image: python:3.11
  script:
    - cd backend
    - pip install -r requirements.txt
    - pytest tests/ -v
  only:
    - main
    - merge_requests

# Build Frontend
build:
  stage: build
  image: node:20
  cache:
    key: "$CI_COMMIT_REF_SLUG-node"
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - main

# Deploy to EC2
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - eval $(ssh-agent -s)
    - echo "$EC2_SSH_KEY" | base64 -d | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
  script:
    - rsync -av --delete dist/ ubuntu@$EC2_HOST:/var/www/momentsandmemories/dist/
    - |
      ssh ubuntu@$EC2_HOST "
        cd /var/www/momentsandmemories &&
        git pull origin main &&
        cd backend &&
        source venv/bin/activate &&
        pip install -r requirements.txt &&
        sudo systemctl restart momentsandmemories-backend
      "
  only:
    - main
  needs:
    - job: build
      artifacts: true
